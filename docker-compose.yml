version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models

  # Optional: swap in when you want persistent storage for logged
  # predictions instead of just in-memory / CSV. Not wired up yet —
  # left here as the next step once you're comfortable with the basics.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: churn_user
      POSTGRES_PASSWORD: churn_pass
      POSTGRES_DB: churn_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
